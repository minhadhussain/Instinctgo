[project]
name = "instinctgo-backend"
version = "0.1.0"
description = "Backend for converting manual business processes into agentic workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
